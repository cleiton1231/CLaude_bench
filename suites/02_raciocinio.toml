# Raciocínio: matemática do dia a dia, lógica, datas, probabilidade e pegadinhas clássicas.
# Avaliação automática pela linha final "RESPOSTA: ...". Esquecer o formato conta como erro:
# seguir formato é parte da prova (o enunciado pede explicitamente).

suite = "raciocinio"
categoria = "raciocinio"
versao = 2

[padrao]
max_tokens = 800
sistema = """Resolva com raciocínio curto e objetivo. A última linha da resposta deve ser exatamente \
no formato `RESPOSTA: <valor>`, sem unidade e sem texto depois."""

# ------------------------------------------------------------------ FÁCEIS
[[caso]]
id = "raciocinio.troco"
dificuldade = "facil"
prompt = "Cada caneta custa R$ 3,50. Comprei 7 canetas e paguei com uma nota de R$ 50. Quanto recebi de troco, em reais?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 25.5, tolerancia = 0.001 }]

[[caso]]
id = "raciocinio.horario-trem"
exemplo_bom = "14h45 + 2h50 = 17h35.\nRESPOSTA: 17:35"
dificuldade = "facil"
consistencia = true
prompt = "Um trem sai às 14h45 e a viagem dura 2 horas e 50 minutos. A que horas ele chega? Responda no formato HH:MM."
checks = [{ tipo = "resposta_final", esperado_regex = '^\s*17\s*[:h]\s*35' }]

[[caso]]
id = "raciocinio.mais-baixa"
dificuldade = "facil"
prompt = "Ana é mais alta que Bia. Bia é mais alta que Carla. Dani é mais alta que Ana. Quem é a mais baixa?"
checks = [{ tipo = "resposta_final", esperado = ["Carla"] }]

[[caso]]
id = "raciocinio.porcentagem"
dificuldade = "facil"
prompt = "Quanto é 15% de 240?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 36 }]

[[caso]]
id = "raciocinio.sequencia"
dificuldade = "facil"
prompt = "Qual o próximo número da sequência: 2, 6, 18, 54, ...?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 162 }]

[[caso]]
id = "raciocinio.minutos"
dificuldade = "facil"
prompt = "Quantos minutos há em 3,5 horas?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 210 }]

# ------------------------------------------------------------------ MÉDIOS
[[caso]]
id = "raciocinio.caderno-caneta"
dificuldade = "medio"
consistencia = true
prompt = """Um caderno e uma caneta custam juntos R$ 11,00. O caderno custa R$ 10,00 a mais que a caneta. \
Quanto custa a caneta, em reais?"""
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 0.5, tolerancia = 0.001 }]

[[caso]]
id = "raciocinio.dia-da-semana"
exemplo_bom = "De 10/03 a 01/04 são 22 dias = 3 semanas + 1 dia.\nRESPOSTA: quinta-feira"
dificuldade = "medio"
prompt = """Hoje é quarta-feira, 10 de março de 2027. Que dia da semana será 1º de abril de 2027? \
Responda só com o nome do dia (ex.: segunda-feira)."""
checks = [{ tipo = "resposta_final", esperado_regex = '^\s*quinta' }]

[[caso]]
id = "raciocinio.dois-dados"
dificuldade = "medio"
prompt = "Lançando dois dados comuns de seis faces, qual a probabilidade de a soma ser 7? Responda como fração ou decimal."
checks = [{ tipo = "resposta_final", formato = "probabilidade", esperado = 0.166667, tolerancia = 0.002 }]

[[caso]]
id = "raciocinio.torneiras"
dificuldade = "medio"
prompt = "Uma torneira enche um tanque em 6 horas; outra enche o mesmo tanque em 3 horas. Abertas juntas, em quantas horas enchem o tanque?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 2, tolerancia = 0.01 }]

[[caso]]
id = "raciocinio.pets"
dificuldade = "medio"
prompt = """Davi, Eva e Fábio têm, cada um, um animal diferente: gato, cão ou peixe. \
Davi não tem gato nem peixe. Eva não tem gato. Quem tem o gato?"""
checks = [{ tipo = "resposta_final", esperado = ["Fábio", "Fabio"] }]

[[caso]]
id = "raciocinio.variacao-percentual"
dificuldade = "medio"
consistencia = true
prompt = "Um produto subiu 20% e, no mês seguinte, caiu 20%. Qual foi a variação total do preço, em porcentagem? (use sinal negativo se caiu)"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = -4, tolerancia = 0.01 }]

[[caso]]
id = "raciocinio.divisiveis"
dificuldade = "medio"
prompt = "Quantos números inteiros de 1 a 100 (inclusive) são divisíveis por 3 ou por 5?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 47 }]

[[caso]]
id = "raciocinio.relogio-atrasado"
exemplo_bom = "8 h × 3 min = 24 min de atraso.\nRESPOSTA: 19:36"
dificuldade = "medio"
prompt = """Um relógio atrasa 3 minutos a cada hora. Ele foi acertado ao meio-dia (12:00). \
Que horário ele vai mostrar quando o horário correto for 20:00? Responda no formato HH:MM."""
checks = [{ tipo = "resposta_final", esperado_regex = '^\s*19\s*[:h]\s*36' }]

[[caso]]
id = "raciocinio.idades"
dificuldade = "medio"
prompt = "Hoje a idade de um pai é o triplo da idade do filho. Daqui a 12 anos, será o dobro. Quantos anos o pai tem hoje?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 36 }]

[[caso]]
id = "raciocinio.bissexto"
dificuldade = "medio"
prompt = "Quantos dias há de 15/02/2028 até 15/03/2028? (conte a diferença entre as datas, não os dias inclusivos)"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 29 }]

# ------------------------------------------------------------------ DIFÍCEIS
[[caso]]
id = "raciocinio.anagramas-banana"
dificuldade = "dificil"
prompt = "Quantos anagramas distintos tem a palavra BANANA?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 60 }]

[[caso]]
id = "raciocinio.monty-hall-4"
dificuldade = "dificil"
consistencia = true
max_tokens = 1000
prompt = """Há 4 portas; atrás de uma está um carro e atrás das outras, nada. Você escolhe uma porta. \
O apresentador, que sabe onde está o carro, abre uma das outras portas que está vazia. \
Você então troca para uma das duas portas fechadas restantes, escolhida ao acaso. \
Qual a probabilidade de ganhar o carro? Responda como fração."""
checks = [{ tipo = "resposta_final", formato = "probabilidade", esperado = 0.375, tolerancia = 0.002 }]

[[caso]]
id = "raciocinio.ultimo-digito"
dificuldade = "dificil"
prompt = "Qual é o último dígito de 7 elevado a 2027?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 3 }]

[[caso]]
id = "raciocinio.comissao"
dificuldade = "dificil"
prompt = "De um grupo de 5 homens e 4 mulheres, quantas comissões de 3 pessoas podem ser formadas com pelo menos uma mulher?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 74 }]

[[caso]]
id = "raciocinio.cavaleiros"
exemplo_bom = "Se A fosse mentiroso, B seria cavaleiro e mentiria. Contradição.\nRESPOSTA: A"
dificuldade = "dificil"
max_tokens = 1000
prompt = """Numa ilha, cavaleiros sempre falam a verdade e mentirosos sempre mentem. \
A diz: "B é mentiroso." B diz: "A e eu somos do mesmo tipo." \
Quem é o cavaleiro? Responda apenas com a letra (A ou B)."""
checks = [{ tipo = "resposta_final", esperado_regex = '^\W*A\W*$' }]

# ------------------------------------------------------------------ v2: casos para separar modelos fortes
[[caso]]
id = "raciocinio.zeros-fatorial"
dificuldade = "medio"
prompt = "Com quantos zeros termina o número 100! (100 fatorial)?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 24 }]

[[caso]]
id = "raciocinio.mil-dias"
dificuldade = "medio"
prompt = "Hoje é terça-feira. Que dia da semana será daqui a exatamente 1000 dias? Responda só com o nome do dia."
checks = [{ tipo = "resposta_final", esperado_regex = '^\s*segunda' }]
exemplo_bom = "1000 = 7×142 + 6; terça + 6 dias.\nRESPOSTA: segunda-feira"

[[caso]]
id = "raciocinio.digitos-distintos"
dificuldade = "medio"
prompt = "Quantos números naturais de 4 dígitos (de 1000 a 9999) têm todos os dígitos diferentes entre si?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 4536 }]

[[caso]]
id = "raciocinio.bases"
dificuldade = "medio"
prompt = "Quanto é 0x2F + 0b1011, em decimal?"
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 58 }]

[[caso]]
id = "raciocinio.valor-esperado"
dificuldade = "medio"
prompt = """Num jogo você paga R$ 10 para lançar um dado comum e recebe 4 vezes o número que sair, em reais. \
Qual é o lucro esperado por jogada, em reais? (negativo se for prejuízo)"""
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 4, tolerancia = 0.01 }]

[[caso]]
id = "raciocinio.caras-seguidas"
dificuldade = "dificil"
consistencia = true
max_tokens = 1200
prompt = """Uma moeda honesta é lançada 5 vezes. Qual a probabilidade de aparecerem pelo menos duas caras \
seguidas em algum momento? Responda como fração."""
checks = [{ tipo = "resposta_final", formato = "probabilidade", esperado = 0.59375, tolerancia = 0.001 }]

[[caso]]
id = "raciocinio.independencia"
dificuldade = "dificil"
prompt = "Em que dia da semana caiu 7 de setembro de 1822 (calendário gregoriano)? Responda só com o nome do dia."
checks = [{ tipo = "resposta_final", esperado_regex = '^\s*s[áa]bado' }]
exemplo_bom = "Pelo algoritmo de Zeller...\nRESPOSTA: sábado"

[[caso]]
id = "raciocinio.juros-dobrar"
dificuldade = "dificil"
prompt = """Um investimento rende 1% ao mês, com juros compostos. Qual o MENOR número inteiro de meses para \
o valor investido pelo menos dobrar?"""
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 70 }]

[[caso]]
id = "raciocinio.escada"
dificuldade = "dificil"
prompt = """Você sobe uma escada de 12 degraus dando passos de 1 ou de 2 degraus por vez. \
De quantas maneiras diferentes você pode chegar ao topo?"""
checks = [{ tipo = "resposta_final", formato = "numero", esperado = 233 }]

[[caso]]
id = "raciocinio.fila-cinco"
dificuldade = "dificil"
consistencia = true
max_tokens = 1200
prompt = """Ana, Bia, Caio, Davi e Elis estão numa fila, nas posições 1 a 5 (da esquerda para a direita).
- Davi está na posição do meio.
- Elis está imediatamente à esquerda de Ana.
- Caio não está em nenhuma das pontas.
- Bia está em alguma posição à direita de Caio.
Quem está na posição 1? Responda só com o nome."""
checks = [{ tipo = "resposta_final", esperado = ["Elis"] }]
