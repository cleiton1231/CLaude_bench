D = "_ _ vinte trinta quarenta cinquenta sessenta setenta oitenta noventa".split()
C = "_ cento duzentos trezentos quatrocentos quinhentos seiscentos setecentos oitocentos novecentos".split()
def por_extenso(n):
    if n == 100:
        return "cem"
    partes = []
    c, r = divmod(n, 100)
    if c:
        partes.append(C[c])
    if r or not c:
        if r < 20:
            if r or not partes:
                partes.append(U[r])
        else:
            d, u = divmod(r, 10)
            partes.append(D[d] + (" e " + U[u] if u else ""))
    return " e ".join(partes)
'''

