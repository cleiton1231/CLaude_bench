id = "codigo.parse-duracao"
dificuldade = "medio"
prompt = """Escreva `parse_duracao(texto: str) -> int` que converte durações como "1h30m", "45s", \
"2h5s", "10m15s" em segundos. Unidades possíveis: h, m, s — cada uma no máximo uma vez e nessa ordem. \
Levante ValueError para entradas inválidas (vazia, unidade desconhecida, ordem errada, número sem unidade)."""
checks = [{ tipo = "python", funcao = "parse_duracao", testes = [
  'assert parse_duracao("1h30m") == 5400',
  'assert parse_duracao("45s") == 45',
  'assert parse_duracao("2h5s") == 7205',
  'assert parse_duracao("10m15s") == 615',
  '''for ruim in ["", "10", "5x", "3m2h", "1h1h", "h"]:
    try:
        parse_duracao(ruim)
        raise AssertionError("aceitou " + repr(ruim))
    except ValueError:
        pass''',
] }]
referencia = '''
import re
def parse_duracao(t):
    m = re.fullmatch(r"(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?", t)
    if not t or not m:
        raise ValueError(t)
    h, mi, s = (int(x) if x else 0 for x in m.groups())
    return h * 3600 + mi * 60 + s
'''

