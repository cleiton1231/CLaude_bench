def primeira_ocorrencia(xs, alvo):
    lo, hi = 0, len(xs)
    while lo < hi:
        meio = (lo + hi) // 2
        if xs[meio] < alvo:
            lo = meio + 1
        else:
            hi = meio
    return lo if lo < len(xs) and xs[lo] == alvo else -1
