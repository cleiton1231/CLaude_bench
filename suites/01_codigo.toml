assert horarios_livres([a, b], "08:00", "17:00", 30) == [("08:00", "09:00"), ("11:00", "12:00"), ("13:00", "15:00"), ("16:00", "17:00")]''',
  '''a = [("09:00", "10:30"), ("12:00", "13:00")]
b = [("10:00", "11:00"), ("15:00", "16:00")]
assert horarios_livres([a, b], "08:00", "17:00", 90) == [("13:00", "15:00")]''',
  'assert horarios_livres([[]], "09:00", "10:00", 60) == [("09:00", "10:00")]',
  'assert horarios_livres([[("08:00", "18:00")]], "09:00", "17:00", 5) == []',
  'assert horarios_livres([[("10:00", "10:20"), ("09:50", "10:05")]], "09:00", "11:00", 10) == [("09:00", "09:50"), ("10:20", "11:00")]',
] }]
referencia = '''
def horarios_livres(agendas, inicio, fim, dur):
    m = lambda s: int(s[:2]) * 60 + int(s[3:])
    h = lambda x: f"{x // 60:02d}:{x % 60:02d}"
    ocup = sorted((m(a), m(b)) for ag in agendas for a, b in ag)
    out, cur, F = [], m(inicio), m(fim)
    for a, b in ocup:
        if a > cur and min(a, F) - cur >= dur:
            out.append((h(cur), h(min(a, F))))
        cur = max(cur, b)
        if cur >= F:
            break
    if F - cur >= dur:
        out.append((h(cur), h(F)))
    return out
'''
