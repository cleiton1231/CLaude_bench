id = "codigo.json-caminho"
dificuldade = "dificil"
prompt = """Escreva `pegar(obj, caminho: str, padrao=None)` que navega em dicts/listas aninhados com \
caminhos como "usuarios[0].endereco.cidade" ou "a.b[2][1]". Chaves são separadas por ponto; índices de \
lista aparecem entre colchetes (podem ser negativos). Se qualquer passo não existir (chave ausente, índice \
fora do intervalo, tipo errado), devolva `padrao`. Caminho vazio devolve o próprio obj."""
checks = [{ tipo = "python", funcao = "pegar", testes = [
  '''d = {"usuarios": [{"nome": "Ana", "endereco": {"cidade": "BH"}}], "m": [[1, 2], [3, 4, 5]]}
assert pegar(d, "usuarios[0].endereco.cidade") == "BH"
assert pegar(d, "m[1][2]") == 5
assert pegar(d, "m[-1][0]") == 3
assert pegar(d, "usuarios[3].nome", "x") == "x"
assert pegar(d, "usuarios.nome") is None
assert pegar(d, "nada.aqui", 0) == 0
assert pegar(d, "") is d''',
  'assert pegar({"a": {"b": None}}, "a.b", 7) is None',
  'assert pegar({"a": "texto"}, "a[0]", "p") == "p"',
] }]
referencia = '''
import re
def pegar(obj, caminho, padrao=None):
    if not caminho:
        return obj
    cur = obj
    for chave, idx in re.findall(r"([^.\[\]]+)|\[(-?\d+)\]", caminho):
        if chave:
            if not isinstance(cur, dict) or chave not in cur:
                return padrao
            cur = cur[chave]
        else:
            if not isinstance(cur, list):
                return padrao
            i = int(idx)
            if not -len(cur) <= i < len(cur):
                return padrao
            cur = cur[i]
    return cur
'''

