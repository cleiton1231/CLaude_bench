prompt = """Escreva `rota_mais_barata(arestas: list[tuple[str, str, int]], origem: str, destino: str) -> tuple[int, list[str]] | None`.
As arestas são direcionadas (de, para, custo ≥ 0). Devolva (custo_total, caminho) do caminho de menor custo, \
onde caminho inclui origem e destino. Se origem == destino, devolva (0, [origem]). Se não houver caminho, devolva None. \
Em caso de empate de custo, qualquer caminho ótimo serve."""
checks = [{ tipo = "python", funcao = "rota_mais_barata", testes = [
  '''A = [("bh", "rio", 7), ("bh", "sp", 9), ("rio", "sp", 1), ("sp", "poa", 11), ("rio", "poa", 20)]
custo, cam = rota_mais_barata(A, "bh", "poa")
assert custo == 19 and cam == ["bh", "rio", "sp", "poa"]''',
  'assert rota_mais_barata([("a", "b", 1)], "b", "a") is None',
  'assert rota_mais_barata([], "x", "x") == (0, ["x"])',
  '''A = [("a", "b", 5), ("a", "c", 1), ("c", "b", 1), ("b", "d", 1)]
c, cam = rota_mais_barata(A, "a", "d")
assert c == 3 and cam[0] == "a" and cam[-1] == "d" and len(cam) == 4''',
  'assert rota_mais_barata([("a", "b", 0)], "a", "b") == (0, ["a", "b"])',
] }]
referencia = '''
import heapq
def rota_mais_barata(arestas, o, d):
    g = {}
    for a, b, c in arestas:
        g.setdefault(a, []).append((b, c))
    dist, ant, h = {o: 0}, {}, [(0, o)]
    while h:
        c, u = heapq.heappop(h)
        if u == d:
            cam = [d]
            while cam[-1] != o:
                cam.append(ant[cam[-1]])
            return c, cam[::-1]
        if c > dist[u]:
            continue
        for v, w in g.get(u, []):
            if c + w < dist.get(v, float("inf")):
                dist[v], ant[v] = c + w, u
                heapq.heappush(h, (c + w, v))
    return None
'''

