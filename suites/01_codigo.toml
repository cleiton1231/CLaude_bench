mínimo de salas para alocar todas as reuniões. Cada reunião é (início, fim) em minutos, com fim exclusivo: \
uma reunião que termina às 10 libera a sala para outra que começa às 10."""
checks = [{ tipo = "python", funcao = "salas_necessarias", testes = [
  'assert salas_necessarias([(0, 30), (5, 10), (15, 20)]) == 2',
  'assert salas_necessarias([(9, 10), (10, 11)]) == 1',
  'assert salas_necessarias([]) == 0',
  'assert salas_necessarias([(1, 5), (2, 6), (3, 7), (4, 8)]) == 4',
  'assert salas_necessarias([(1, 2)] * 3) == 3',
] }]
referencia = '''
def salas_necessarias(r):
    ev = sorted([(a, 1) for a, _ in r] + [(b, -1) for _, b in r])
    cur = best = 0
    for _, d in ev:
        cur += d
        best = max(best, cur)
    return best
'''

