id = "codigo.caminho-grade"
dificuldade = "medio"
prompt = """Escreva `menor_caminho(grade: list[str]) -> int`. A grade tem '.' (livre), '#' (parede), \
'S' (início) e 'E' (fim). Movimentos: cima, baixo, esquerda, direita. Devolva o número mínimo de passos \
de S até E, ou -1 se for impossível."""
checks = [{ tipo = "python", funcao = "menor_caminho", testes = [
  'assert menor_caminho(["S.E"]) == 2',
  'assert menor_caminho(["S#E"]) == -1',
  'assert menor_caminho(["S..#", ".#..", "...E"]) == 5',
  'assert menor_caminho(["S...", "###.", "E..."]) == 8',
  'assert menor_caminho(["SE"]) == 1',
] }]
referencia = '''
from collections import deque
def menor_caminho(g):
    R, C = len(g), len(g[0])
    s = next((r, c) for r in range(R) for c in range(C) if g[r][c] == "S")
    q, vis = deque([(s, 0)]), {s}
    while q:
        (r, c), d = q.popleft()
        if g[r][c] == "E":
            return d
        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
            nr, nc = r + dr, c + dc
            if 0 <= nr < R and 0 <= nc < C and g[nr][nc] != "#" and (nr, nc) not in vis:
                vis.add((nr, nc))
                q.append(((nr, nc), d + 1))
    return -1
'''

