[[caso]]
id = "codigo.avaliar-expressao"
dificuldade = "dificil"
consistencia = true
max_tokens = 1400
prompt = """Escreva `avaliar(expr: str) -> float` que calcula expressões com números (inteiros ou \
decimais com ponto), + - * /, parênteses e menos unário, respeitando precedência e associatividade à esquerda. \
É PROIBIDO usar eval, exec, compile ou ast.literal_eval. Espaços podem aparecer em qualquer lugar."""
checks = [
  { tipo = "python", funcao = "avaliar", testes = [
    'assert abs(avaliar("1 + 2 * 3") - 7) < 1e-9',
    'assert abs(avaliar("(1 + 2) * 3") - 9) < 1e-9',
    'assert abs(avaliar("10 / 4") - 2.5) < 1e-9',
    'assert abs(avaliar("8 - 3 - 2") - 3) < 1e-9',
    'assert abs(avaliar("16 / 4 / 2") - 2) < 1e-9',
    'assert abs(avaliar("-(2 + 3) * -2") - 10) < 1e-9',
    'assert abs(avaliar("2 * (3 + (4 - 1)) / 0.5") - 24) < 1e-9',
    'assert abs(avaliar("--3") - 3) < 1e-9',
  ] },
  { tipo = "nao_regex", padrao = '\beval\s*\(|\bexec\s*\(|\bcompile\s*\(|literal_eval' },
]
referencia = '''
import re
def avaliar(expr):
    toks = re.findall(r"\d+\.?\d*|\.\d+|[-+*/()]", expr)
    pos = 0
    def peek():
        return toks[pos] if pos < len(toks) else None
    def take():
        nonlocal pos
        pos += 1
        return toks[pos - 1]
    def soma():
        v = prod()
        while peek() in ("+", "-"):
            v = v + prod() if take() == "+" else v - prod()
        return v
    def prod():
        v = unario()
        while peek() in ("*", "/"):
            v = v * unario() if take() == "*" else v / unario()
        return v
    def unario():
        if peek() == "-":
            take()
            return -unario()
        if peek() == "+":
            take()
            return unario()
        if peek() == "(":
            take()
            v = soma()
            take()
            return v
        return float(take())
    return soma()
'''

