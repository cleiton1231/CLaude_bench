id = "codigo.rle"
dificuldade = "medio"
prompt = """Escreva duas funções:
- `rle_codificar(s: str) -> str`: "aaabccdddd" → "3a1b2c4d"
- `rle_decodificar(s: str) -> str`: inverso; contagens podem ter vários dígitos ("12a1b" → 12 'a' e 1 'b').
Assuma que a string original não contém dígitos."""
checks = [{ tipo = "python", funcao = "rle_decodificar", testes = [
  'assert rle_codificar("aaabccdddd") == "3a1b2c4d"',
  'assert rle_codificar("") == ""',
  'assert rle_codificar("x" * 12 + "y") == "12x1y"',
  'assert rle_decodificar("12x1y") == "x" * 12 + "y"',
  'assert rle_decodificar(rle_codificar("abbcccdddde")) == "abbcccdddde"',
  'assert rle_decodificar("") == ""',
] }]
referencia = '''
import re
from itertools import groupby
def rle_codificar(s):
    return "".join(f"{len(list(g))}{c}" for c, g in groupby(s))
def rle_decodificar(s):
    return "".join(c * int(n) for n, c in re.findall(r"(\d+)(\D)", s))
'''

