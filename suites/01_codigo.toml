id = "codigo.validar-cpf"
dificuldade = "medio"
consistencia = true
prompt = """Escreva `validar_cpf(cpf: str) -> bool` que valida um CPF brasileiro pelos dígitos \
verificadores. Aceite com ou sem pontuação (pontos e hífen). CPFs com todos os dígitos iguais são inválidos. \
Qualquer entrada que não resulte em 11 dígitos é inválida."""
checks = [{ tipo = "python", funcao = "validar_cpf", testes = [
  'assert validar_cpf("529.982.247-25") is True',
  'assert validar_cpf("52998224725") is True',
  'assert validar_cpf("111.444.777-35") is True',
  'assert validar_cpf("529.982.247-24") is False',
  'assert validar_cpf("111.111.111-11") is False',
  'assert validar_cpf("123") is False',
  'assert validar_cpf("000.000.001-91") is True',
] }]
referencia = '''
import re
def validar_cpf(cpf):
    d = re.sub(r"[.-]", "", cpf)
    if len(d) != 11 or not d.isdigit() or len(set(d)) == 1:
        return False
    for n in (9, 10):
        s = sum(int(d[i]) * (n + 1 - i) for i in range(n))
        dv = (s * 10) % 11 % 10
        if dv != int(d[n]):
            return False
    return True
'''

