import datetime
def dias_uteis(i, f, fer):
    n = 0
    while i <= f:
        if i.weekday() < 5 and i not in fer:
            n += 1
        i += datetime.timedelta(days=1)
    return n
'''

[[caso]]
id = "codigo.lru-cache"
dificuldade = "medio"
prompt = """Implemente a classe `LRUCache(capacidade: int)` com:
- `get(chave)` → valor ou -1 se ausente (um acesso conta como uso recente);
- `put(chave, valor)` → insere/atualiza; ao exceder a capacidade, remove o item usado há mais tempo.
Ambas devem ser O(1) em média."""
checks = [{ tipo = "python", funcao = "LRUCache", testes = [
  '''c = LRUCache(2)
c.put(1, "a"); c.put(2, "b")
assert c.get(1) == "a"
c.put(3, "c")
assert c.get(2) == -1
assert c.get(3) == "c"''',
  '''c = LRUCache(2)
c.put(1, 1); c.put(2, 2); c.put(1, 10); c.put(3, 3)
assert c.get(1) == 10 and c.get(2) == -1''',
  '''c = LRUCache(1)
c.put("x", 1); c.put("y", 2)
assert c.get("x") == -1 and c.get("y") == 2''',
] }]
referencia = '''
from collections import OrderedDict
class LRUCache:
    def __init__(self, capacidade):
        self.c, self.d = capacidade, OrderedDict()
    def get(self, k):
        if k not in self.d:
            return -1
        self.d.move_to_end(k)
        return self.d[k]
    def put(self, k, v):
        self.d[k] = v
        self.d.move_to_end(k)
        if len(self.d) > self.c:
            self.d.popitem(last=False)
'''

