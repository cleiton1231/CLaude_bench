# Cenário agêntico: achar a causa raiz num log longo (1217 linhas). O ler_arquivo devolve 200 linhas por vez:
# é preciso paginar ou usar buscar_no_projeto. Há avisos de cache/GC como pista falsa.
id = "agente.causa-raiz-log"
dificuldade = "dificil"
max_turnos = 14
ferramentas = ["listar_arquivos", "ler_arquivo", "buscar_no_projeto", "finalizar"]
tarefa = "O serviço começou a falhar por volta das 14:32. Descubra a causa raiz no log e diga qual configuração precisa ser ajustada (arquivo e chave). Não altere nada; responda com `finalizar`."
checks = [
  { tipo = "resposta_regex", padrao = 'pool|conex[õo]es', peso = 2 },
  { tipo = "resposta_regex", padrao = 'max_conexoes', peso = 2 },
  { tipo = "resposta_regex", padrao = 'db\.toml' },
  { tipo = "finalizou" },
]
resposta_referencia = "Causa raiz: o pool de conexões do banco esgotou (max_conexoes=10) às 14:32:07; os timeouts da API são consequência. Ajustar max_conexoes em config/db.toml."

[arquivos]
"config/db.toml" = '''
host = "db.interno"
porta = 5432
max_conexoes = 10
timeout_ms = 30000
'''
"config/cache.toml" = '''
host = "redis.interno"
ttl_s = 300
'''
