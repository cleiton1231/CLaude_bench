"tests/test_relatorio.py" = '''
import unittest

from relatorio.resumo import linha_total
from relatorio.util import formatar_moeda


class TestRelatorio(unittest.TestCase):
    def test_moeda(self):
        self.assertEqual(formatar_moeda(1234.5), "R$ 1.234,50")
        self.assertEqual(formatar_moeda(0), "R$ 0,00")
        self.assertEqual(formatar_moeda(1000000), "R$ 1.000.000,00")

    def test_total(self):
        itens = [("caneta", 3.5, 2), ("caderno", 1200, 1)]
        self.assertEqual(linha_total(itens), "Total: R$ 1.207,00")
'''

