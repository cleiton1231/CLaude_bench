"README.md" = '''
# texto.slug

`slugify(titulo: str, max_len: int = 50) -> str` gera slugs para URLs:

1. remove acentos (á → a, ç → c, ã → a, etc.);
2. converte para minúsculas;
3. qualquer sequência de caracteres que não seja letra ASCII ou dígito vira UM hífen;
4. remove hífens do começo e do fim;
5. se passar de `max_len`, corta em `max_len` caracteres e remove hífen que tenha sobrado no fim;
6. entrada vazia (ou só símbolos) devolve string vazia.
'''
