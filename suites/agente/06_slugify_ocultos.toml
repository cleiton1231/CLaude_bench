[ocultos]
"tests/test_slug_oculto.py" = '''
import unittest

from texto.slug import slugify


class TestSlugOculto(unittest.TestCase):
    def test_acentos_e_cedilha(self):
        self.assertEqual(slugify("Ação e Reação"), "acao-e-reacao")

    def test_simbolos_colapsam(self):
        self.assertEqual(slugify("C++ & Python --- 2027!!"), "c-python-2027")

    def test_pontas(self):
        self.assertEqual(slugify("  ...Título...  "), "titulo")

    def test_corte(self):
        s = slugify("palavra " * 20, max_len=20)
        self.assertLessEqual(len(s), 20)
        self.assertFalse(s.endswith("-"))
        self.assertEqual(s, "palavra-palavra-pala")

    def test_corte_sem_hifen_final(self):
        self.assertEqual(slugify("abc def", max_len=4), "abc")

    def test_vazio(self):
        self.assertEqual(slugify(""), "")
        self.assertEqual(slugify("!!!"), "")
'''

[referencia]
"texto/slug.py" = '''
import re
import unicodedata


def slugify(titulo, max_len=50):
    s = "".join(c for c in unicodedata.normalize("NFD", titulo) if unicodedata.category(c) != "Mn")
    s = re.sub(r"[^a-z0-9]+", "-", s.lower()).strip("-")
    return s[:max_len].rstrip("-")
'''
