from loja.cupons import CUPONS


class CupomInvalido(Exception):
    pass


class Carrinho:
    def __init__(self):
        self.itens = []  # (nome, preco_unitario, quantidade)
        self.cupom = None

    def adicionar(self, nome, preco, quantidade=1):
        if preco < 0 or quantidade <= 0:
            raise ValueError("item inválido")
        self.itens.append((nome, preco, quantidade))

    def subtotal(self):
        return round(sum(p * q for _, p, q in self.itens), 2)

    def aplicar_cupom(self, codigo):
