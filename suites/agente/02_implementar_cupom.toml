"tests/test_carrinho.py" = '''
import unittest

from loja.carrinho import Carrinho, CupomInvalido


class TestCarrinho(unittest.TestCase):
    def setUp(self):
        self.c = Carrinho()
        self.c.adicionar("caneca", 40, 2)
        self.c.adicionar("camiseta", 70)

    def test_sem_cupom(self):
        self.assertEqual(self.c.total(), 150)

    def test_percentual_sem_diferenciar_caixa(self):
        self.c.aplicar_cupom("bemvindo10")
        self.assertEqual(self.c.total(), 135)

    def test_fixo(self):
        self.c.aplicar_cupom("FIXO20")
        self.assertEqual(self.c.total(), 130)

    def test_minimo_nao_atingido(self):
        with self.assertRaises(CupomInvalido):
            self.c.aplicar_cupom("MEGA30")

    def test_inexistente(self):
        with self.assertRaises(CupomInvalido):
            self.c.aplicar_cupom("XPTO")

    def test_substitui_cupom(self):
        self.c.aplicar_cupom("BEMVINDO10")
        self.c.aplicar_cupom("FIXO20")
        self.assertEqual(self.c.total(), 130)

    def test_nunca_negativo(self):
        c = Carrinho()
        c.adicionar("adesivo", 30)
        c.aplicar_cupom("BRINDE50")
        self.assertEqual(c.total(), 0)

    def test_percentual_arredonda(self):
        c = Carrinho()
        c.adicionar("caneta", 3.33, 3)
        c.aplicar_cupom("BEMVINDO10")
        self.assertEqual(c.total(), 8.99)
