"loja/carrinho.py" = '''
from loja.cupons import CUPONS


class CupomInvalido(Exception):
    pass


class Carrinho:
    def __init__(self):
        self.itens = []
        self.cupom = None

    def adicionar(self, nome, preco, quantidade=1):
        if preco < 0 or quantidade <= 0:
            raise ValueError("item inválido")
        self.itens.append((nome, preco, quantidade))

    def subtotal(self):
        return round(sum(p * q for _, p, q in self.itens), 2)

    def aplicar_cupom(self, codigo):
        dados = CUPONS.get(codigo.upper())
        if dados is None or self.subtotal() < dados["minimo"]:
            raise CupomInvalido(codigo)
        self.cupom = dados

    def total(self):
        s = self.subtotal()
        if self.cupom:
            if self.cupom["tipo"] == "percentual":
                s -= s * self.cupom["valor"] / 100
            else:
                s -= self.cupom["valor"]
        return round(max(s, 0), 2)
'''
