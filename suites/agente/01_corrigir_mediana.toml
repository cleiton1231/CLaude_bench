def media(xs):
    if not xs:
        raise ValueError("lista vazia")
    return sum(xs) / len(xs)


def mediana(xs):
    if not xs:
        raise ValueError("lista vazia")
    meio = len(xs) // 2
    if len(xs) % 2 == 0:
        return (xs[meio] + xs[meio + 1]) / 2
