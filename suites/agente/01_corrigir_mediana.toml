"tests/test_estatistica.py" = '''
import unittest

from calc.estatistica import media, mediana


class TestEstatistica(unittest.TestCase):
    def test_media(self):
        self.assertEqual(media([1, 2, 3]), 2)

    def test_mediana_impar(self):
        self.assertEqual(mediana([3, 1, 2]), 2)

    def test_mediana_par(self):
        self.assertEqual(mediana([4, 1, 3, 2]), 2.5)

    def test_nao_altera_entrada(self):
        xs = [3, 1, 2]
        mediana(xs)
        self.assertEqual(xs, [3, 1, 2])

    def test_vazia(self):
        with self.assertRaises(ValueError):
            mediana([])
'''

