"calc/estatistica.py" = '''
def media(xs):
    if not xs:
        raise ValueError("lista vazia")
    return sum(xs) / len(xs)


def mediana(xs):
    if not xs:
        raise ValueError("lista vazia")
    ys = sorted(xs)
    meio = len(ys) // 2
    if len(ys) % 2 == 0:
        return (ys[meio - 1] + ys[meio]) / 2
    return ys[meio]
'''
