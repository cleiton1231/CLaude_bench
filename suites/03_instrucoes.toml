]

# ------------------------------------------------------------------ v2 (checks `predicado` rodam na sandbox)
[[caso]]
id = "instrucoes.tres-paragrafos"
dificuldade = "medio"
max_tokens = 500
prompt = """Explique o que é um compilador em exatamente 3 parágrafos, separados por uma linha em branco. \
O segundo parágrafo deve ter uma única frase. Sem listas e sem títulos."""
checks = [
  { tipo = "paragrafos", min = 3, max = 3, peso = 2 },
  { tipo = "predicado", codigo = '''
import re
def ok(t):
    ps = [p for p in re.split(r"\n\s*\n", t.strip()) if p.strip()]
    if len(ps) < 2:
        return False, "menos de 2 parágrafos"
    n = len([f for f in re.split(r"(?<=[.!?])\s+", ps[1].strip()) if re.search(r"\w", f)])
    return n == 1, f"2º parágrafo com {n} frase(s)"
''' },
  { tipo = "nao_regex", padrao = '^\s*(#|[-*•]|\d+[.)])' },
]
exemplo_bom = """Um compilador é um programa que traduz código-fonte escrito numa linguagem de alto nível para outra linguagem, normalmente código de máquina. Ele permite que o programador escreva em C, Rust ou Java sem lidar com instruções do processador.

A tradução passa por análise léxica, sintática e semântica, seguida de otimização e geração de código.

O resultado é um executável que roda direto no hardware, geralmente mais rápido que código interpretado. Erros de tipo e de sintaxe são apontados antes da execução."""

[[caso]]
id = "instrucoes.acrostico"
dificuldade = "dificil"
prompt = """Escreva um acróstico com a palavra REDE sobre redes de computadores: exatamente 4 linhas, cada uma \
começando pela letra correspondente (R, E, D, E). Escreva só as 4 linhas, sem título."""
checks = [{ tipo = "predicado", peso = 2, codigo = '''
import re
def ok(t):
    linhas = [l for l in t.strip().splitlines() if l.strip()]
    if len(linhas) != 4:
        return False, f"{len(linhas)} linhas"
    iniciais = "".join((re.search(r"[A-Za-zÀ-ÿ]", l) or re.search(r".", "?")).group(0).upper() for l in linhas)
    return iniciais == "REDE", f"iniciais {iniciais}"
''' }]
exemplo_bom = """Roteadores encaminham pacotes pelo caminho certo,
Endereços IP identificam cada máquina,
Dados viajam em quadros e segmentos,
Enlaces físicos ligam tudo isso."""

[[caso]]
id = "instrucoes.paises-ordem"
dificuldade = "dificil"
consistencia = true
prompt = """Liste 5 países da América do Sul em ordem alfabética, numerados de 1 a 5, um por linha. Todos devem ter \
nome com mais de 5 letras, sem repetir. Nada além da lista."""
checks = [{ tipo = "predicado", peso = 3, codigo = '''
import re, unicodedata
PAISES = {"argentina", "bolivia", "brasil", "chile", "colombia", "equador", "guiana", "paraguai",
          "peru", "suriname", "uruguai", "venezuela"}
def norm(s):
    s = "".join(c for c in unicodedata.normalize("NFD", s) if unicodedata.category(c) != "Mn")
    return re.sub(r"[^a-z]", "", s.lower())
def ok(t):
    linhas = [l for l in t.strip().splitlines() if l.strip()]
    if len(linhas) != 5:
        return False, f"{len(linhas)} linhas"
    nomes = []
    for i, l in enumerate(linhas, 1):
        m = re.match(r"\s*(\d+)[.)]\s*(.+)", l)
        if not m or int(m.group(1)) != i:
            return False, f"numeração errada na linha {i}"
        nomes.append(norm(m.group(2)))
    if any(n not in PAISES for n in nomes):
        return False, f"não é país sul-americano: {[n for n in nomes if n not in PAISES]}"
    if any(len(n) <= 5 for n in nomes):
        return False, "nome com 5 letras ou menos"
    if len(set(nomes)) != 5:
        return False, "repetiu país"
    return nomes == sorted(nomes), "ordem alfabética" if nomes == sorted(nomes) else "fora de ordem"
''' }]
exemplo_bom = "1. Argentina\n2. Bolívia\n3. Brasil\n4. Colômbia\n5. Uruguai"

[[caso]]
id = "instrucoes.json-coerente"
dificuldade = "dificil"
prompt = """Gere um JSON com a chave "alunos": uma lista de 3 objetos, cada um com "nome" (texto), "nota" (número de \
0 a 10) e "aprovado" (true se nota >= 6, senão false). Inclua pelo menos um aprovado e um reprovado. Só o JSON."""
checks = [{ tipo = "predicado", peso = 3, codigo = '''
import json, re
def ok(t):
    m = re.search(r"```(?:json)?\s*(.*?)```", t, re.S)
    try:
        d = json.loads(m.group(1) if m else t)
    except Exception as e:
        return False, f"JSON inválido: {e}"
    al = d.get("alunos") if isinstance(d, dict) else None
    if not isinstance(al, list) or len(al) != 3:
        return False, "alunos não é lista de 3"
    for a in al:
        if set(a) != {"nome", "nota", "aprovado"}:
            return False, f"chaves {sorted(a)}"
        if not isinstance(a["nome"], str) or isinstance(a["nota"], bool) or not isinstance(a["nota"], (int, float)):
            return False, "tipos errados"
        if not 0 <= a["nota"] <= 10 or a["aprovado"] is not (a["nota"] >= 6):
            return False, f"incoerente: nota {a['nota']} aprovado {a['aprovado']}"
    if len({a["aprovado"] for a in al}) != 2:
        return False, "faltou aprovado ou reprovado"
    return True, "ok"
''' }]
exemplo_bom = '{"alunos": [{"nome": "Ana", "nota": 8.5, "aprovado": true}, {"nome": "Beto", "nota": 4, "aprovado": false}, {"nome": "Cris", "nota": 6, "aprovado": true}]}'
