# Copie para config/local.toml (ou rode scripts/instalar.sh). Fica fora do git.
# Qualquer chave de config/hardware.toml pode ser sobrescrita aqui.

[servidor]
binario = "~/llama.cpp/build/bin/llama-server"
porta = 8080

[sandbox]
modo = "auto"              # auto | bwrap | unshare | basico
exigir_isolamento = false  # true = recusa rodar código do modelo sem bwrap

